<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="100%" height="100%">
  <defs>
    <linearGradient id="iconBgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0E4875"/>
      <stop offset="60%" stop-color="#0B3D62"/>
      <stop offset="100%" stop-color="#061F33"/>
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F5EBCA"/>
      <stop offset="40%" stop-color="#D4AF37"/>
      <stop offset="100%" stop-color="#A57F1A"/>
    </linearGradient>
  </defs>

  <!-- Squircle Base -->
  <rect x="0" y="0" width="200" height="200" rx="46" fill="url(#iconBgGrad)"/>
  <!-- Subtle inner border -->
  <rect x="3" y="3" width="194" height="194" rx="43" fill="none" stroke="url(#goldGrad)" stroke-width="1.5" stroke-opacity="0.35"/>

  <!-- Center Emblem -->
  <g transform="translate(45, 25)">
    <!-- Outer line box -->
    <rect x="0" y="0" width="110" height="84" rx="4" fill="none" stroke="url(#goldGrad)" stroke-width="2.5"/>
    <g stroke="url(#goldGrad)" stroke-width="2" fill="none" stroke-linecap="round">
      <path d="M 18 64 L 18 24 C 18 15 30 10 38 10 L 38 64 Z"/>
      <path d="M 44 64 L 44 12 L 62 12 L 62 64 Z"/>
      <circle cx="53" cy="20" r="3.5" fill="url(#goldGrad)"/>
      <path d="M 68 64 L 68 22 L 86 22 L 86 64 Z"/>
      <line x1="8" y1="64" x2="102" y2="64" stroke-width="2"/>
    </g>
  </g>

  <!-- DMC Text -->
  <text x="100" y="142" font-family="'Tajawal', 'Inter', sans-serif" font-size="28" font-weight="900" fill="url(#goldGrad)" text-anchor="middle" letter-spacing="3">DMC</text>
  <!-- Dar Makkah in Arabic -->
  <text x="100" y="172" font-family="'Tajawal', sans-serif" font-size="22" font-weight="800" fill="url(#goldGrad)" text-anchor="middle" letter-spacing="1">دار مــكـة</text>
</svg>
